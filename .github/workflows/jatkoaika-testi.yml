
name: Jatkoaika yhteystesti

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Testaa Jatkoajan RSS-yhteys
        run: |
          python - <<'PY'
          import urllib.request
          url = "https://keskustelu.jatkoaika.com/forums/kalpa.161/index.rss"
          try:
              req = urllib.request.Request(
                  url, headers={"User-Agent": "Mozilla/5.0"}
              )
              with urllib.request.urlopen(req, timeout=20) as response:
                  data = response.read()
                  print("HTTP:", response.status)
                  print("Sisältö alkaa:", data[:150])
          except Exception as e:
              print("Yhteys epäonnistui:", repr(e))
              raise
          PY
